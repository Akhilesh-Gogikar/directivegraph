[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "directivegraph"
version = "0.1.0"
description = "Explain path-specific precedence for repository agent instructions"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Akhilesh Gogikar"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/akigogikar/directivegraph"
Issues = "https://github.com/akigogikar/directivegraph/issues"
Changelog = "https://github.com/akigogikar/directivegraph/blob/main/CHANGELOG.md"

[project.scripts]
directivegraph = "directivegraph.__main__:main"

[tool.setuptools.packages.find]
include = ["directivegraph*"]
