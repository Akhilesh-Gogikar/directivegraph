name: Feature proposal
description: Propose a documented filename, precedence, parser, or renderer improvement
title: "feature: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which path-specific question cannot DirectiveGraph answer today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful proposal
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public primary source
      description: Required for a filename or precedence behavior.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Conservative semantics and cross-format impact
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: The proposal can use synthetic fixtures and does not infer undocumented natural-language conflicts.
          required: true
