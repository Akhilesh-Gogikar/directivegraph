name: Bug report
description: Report reproducible incorrect DirectiveGraph behavior using synthetic files
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not attach private repository instructions, credentials, or undisclosed vulnerabilities. Use a private security advisory for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system
      placeholder: Python 3.12.5, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: Minimal synthetic repository tree and instruction contents
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and documented semantic
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This report contains only synthetic material I am authorized to share and no secrets.
          required: true
